<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>京津冀教育协同指数(年度)</title>
  <style>
    /* 所有样式均限制在 .jjj-dashboard 内，方便合并到其他网页。 */
    .jjj-dashboard {
      --bg: #031126;
      --panel: #071b35;
      --line: #173b62;
      --text: #f4f8ff;
      --muted: #8faac6;
      --cyan: #19c9ff;
      position: relative;
      isolation: isolate;
      max-width: 1440px;
      margin: auto;
      padding: 32px 36px;
      color: var(--text);
      background: radial-gradient(circle at 50% -20%, #0d3d70 0, #071b35 30%, #031126 72%);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      box-sizing: border-box
    }

    .jjj-dashboard * {
      box-sizing: border-box
    }

    .jjj-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-top: 4px solid var(--cyan);
      padding: 18px 4px 24px
    }

    .jjj-eyebrow,
    .jjj-kicker {
      margin: 0 0 7px;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .15em
    }

    .jjj-head h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.15
    }

    .jjj-subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px
    }

    .jjj-method {
      width: 310px;
      padding: 13px 16px;
      border: 1px solid #1d4a77;
      border-radius: 12px;
      background: #06182f;
      display: grid;
      gap: 3px
    }

    .jjj-method span {
      color: var(--cyan);
      font-size: 11px
    }

    .jjj-method strong {
      font-size: 15px
    }

    .jjj-method small {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5
    }

    .jjj-panel {
      background: linear-gradient(150deg, rgba(9, 35, 67, .98), rgba(5, 22, 43, .99));
      border: 1px solid #14395f;
      border-radius: 14px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, .2)
    }

    .jjj-trend-panel {
      padding: 24px 28px 16px
    }

    .jjj-section-head {
      display: flex;
      justify-content: space-between;
      gap: 18px
    }

    .jjj-section-head h2 {
      font-size: 21px;
      margin: 0
    }

    .jjj-hint {
      font-size: 12px;
      color: var(--muted);
      margin: 9px 0
    }

    .jjj-legend {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 16px 0 0;
      color: #bfd0e0;
      font-size: 13px
    }

    .jjj-legend span {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .jjj-legend i {
      display: block;
      width: 24px;
      height: 3px;
      border-radius: 3px
    }

    .jjj-legend .jjj-bar-key {
      height: 10px;
      background: linear-gradient(#147cff, #06408f)
    }

    .jjj-chart-wrap {
      position: relative;
      max-width: 1200px;
      margin: auto
    }

    .jjj-trend-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible
    }

    .jjj-grid {
      stroke: #173b62;
      stroke-width: 1
    }

    .jjj-axis,
    .jjj-year {
      fill: #8faac6;
      font-size: 12px
    }

    .jjj-bar-label {
      fill: #dceaff;
      font-size: 11px;
      font-weight: 600
    }

    .jjj-focus {
      stroke: #b8d3ed;
      stroke-width: 1;
      stroke-dasharray: 4 5;
      opacity: .5;
      pointer-events: none
    }

    .jjj-point {
      cursor: pointer;
      outline: none
    }

    .jjj-point:focus {
      stroke: #fff;
      stroke-width: 4
    }

    .jjj-tooltip {
      position: fixed;
      z-index: 1002;
      display: none;
      transform: translate(-50%, -110%);
      min-width: 180px;
      padding: 11px 13px;
      border-radius: 9px;
      border: 1px solid #2a5b89;
      background: rgba(3, 17, 38, .97);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .4);
      pointer-events: none
    }

    .jjj-tooltip.show {
      display: grid;
      gap: 4px
    }

    .jjj-tooltip strong {
      font-size: 14px
    }

    .jjj-tooltip span {
      font-size: 12px;
      color: #c6d7e8
    }

    .jjj-tooltip em {
      font-size: 11px;
      color: var(--cyan);
      font-style: normal
    }

    .jjj-note {
      margin: 0 12px 6px;
      color: #738da7;
      font-size: 11px;
      line-height: 1.6
    }

    .jjj-source {
      color: #6f89a3;
      font-size: 11px;
      line-height: 1.8;
      padding: 20px 5px 0
    }

    .jjj-source strong {
      color: #8faac6
    }

    .jjj-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(0, 8, 20, .8);
      backdrop-filter: blur(8px)
    }

    .jjj-modal.open {
      display: grid
    }

    .jjj-dialog {
      width: min(1180px, 96vw);
      max-height: 92vh;
      overflow: auto;
      padding: 20px;
      border: 1px solid #24547f;
      border-radius: 18px;
      background: linear-gradient(145deg, #071b35, #041326);
      box-shadow: 0 35px 100px rgba(0, 0, 0, .62);
      animation: jjj-in .2s ease-out
    }

    .jjj-modal-head {
      position: sticky;
      top: -20px;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: -20px -20px 18px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid #173b62;
      background: rgba(5, 20, 40, .97)
    }

    .jjj-modal-head p {
      margin: 0 0 4px;
      color: var(--cyan);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .15em
    }

    .jjj-modal-head h2 {
      margin: 0;
      font-size: 23px
    }

    .jjj-close {
      width: 38px;
      height: 38px;
      border: 1px solid #315b82;
      border-radius: 50%;
      background: #0a2949;
      color: #d9e8f6;
      font-size: 27px;
      line-height: 1;
      cursor: pointer
    }

    .jjj-close:hover,
    .jjj-close:focus {
      border-color: var(--cyan);
      outline: 2px solid rgba(25, 201, 255, .25)
    }

    .jjj-detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.13fr) minmax(360px, .87fr);
      gap: 18px
    }

    .jjj-detail,
    .jjj-metrics {
      padding: 24px 26px
    }

    .jjj-selection {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .jjj-selection h3 {
      font-size: 24px;
      margin: 0
    }

    .jjj-score {
      border: 2px solid;
      border-radius: 13px;
      padding: 9px 15px;
      text-align: right;
      background: #05162d
    }

    .jjj-score strong {
      font-size: 22px;
      display: block
    }

    .jjj-score span {
      color: var(--muted);
      font-size: 11px
    }

    .jjj-summary {
      display: grid;
      grid-template-columns: .75fr .75fr 1.5fr;
      margin: 20px 0 4px;
      border: 1px solid #173b62;
      border-radius: 10px;
      overflow: hidden
    }

    .jjj-summary div {
      padding: 12px 15px;
      border-right: 1px solid #173b62;
      display: grid;
      gap: 4px
    }

    .jjj-summary div:last-child {
      border: 0
    }

    .jjj-summary span {
      font-size: 10px;
      color: var(--muted)
    }

    .jjj-summary strong {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .jjj-positive {
      color: #39d4b0 !important
    }

    .jjj-negative {
      color: #ff7080 !important
    }

    .jjj-radar {
      display: block;
      width: 100%;
      max-height: 390px;
      margin: auto
    }

    .jjj-radar-grid,
    .jjj-radar-axis {
      fill: none;
      stroke: #20466e;
      stroke-width: 1
    }

    .jjj-radar-label {
      fill: #d7e5f3;
      font-size: 12px;
      font-weight: 600
    }

    .jjj-radar-value {
      fill: var(--cyan);
      font-size: 11px;
      font-weight: 700
    }

    .jjj-metric-title {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .jjj-metric-title h3 {
      margin: 0;
      font-size: 21px
    }

    .jjj-scale {
      padding: 5px 9px;
      border-radius: 99px;
      background: #0c3155;
      color: #88cdef;
      font-size: 10px
    }

    .jjj-metric-list {
      display: grid;
      gap: 19px;
      margin-top: 24px
    }

    .jjj-metric-row {
      display: grid;
      gap: 7px
    }

    .jjj-metric-top,
    .jjj-metric-foot {
      display: flex;
      justify-content: space-between;
      gap: 12px
    }

    .jjj-metric-top strong {
      font-size: 13px
    }

    .jjj-metric-top b {
      font-size: 14px
    }

    .jjj-track {
      height: 6px;
      background: #102f50;
      border-radius: 99px;
      overflow: hidden
    }

    .jjj-track i {
      display: block;
      height: 100%;
      border-radius: 99px
    }

    .jjj-metric-foot {
      font-size: 10px;
      color: var(--muted)
    }

    .jjj-compare {
      border-top: 1px solid #173b62;
      margin-top: 24px;
      padding-top: 18px
    }

    .jjj-compare h4 {
      font-size: 12px;
      color: #bcd0e3;
      margin: 0 0 13px
    }

    .jjj-compare-row {
      display: grid;
      grid-template-columns: 55px 1fr 42px;
      align-items: center;
      gap: 9px;
      margin: 9px 0;
      font-size: 11px
    }

    .jjj-compare-row>span {
      display: flex;
      gap: 6px;
      align-items: center
    }

    .jjj-compare-row span i {
      width: 7px;
      height: 7px;
      border-radius: 50%
    }

    .jjj-compare-row>i {
      height: 5px;
      background: #102f50;
      border-radius: 99px;
      overflow: hidden
    }

    .jjj-compare-row>i b {
      display: block;
      height: 100%;
      border-radius: 99px
    }

    .jjj-compare-row>strong {
      text-align: right
    }

    .jjj-modal-note {
      margin: 14px 0 0;
      color: #6f89a3;
      font-size: 10px;
      text-align: center
    }

    @keyframes jjj-in {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.985)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @media(max-width:900px) {
      .jjj-dashboard {
        padding: 22px 16px
      }

      .jjj-head {
        align-items: flex-start;
        gap: 18px
      }

      .jjj-method {
        width: 280px
      }

      .jjj-detail-grid {
        grid-template-columns: 1fr
      }

      .jjj-trend-panel {
        padding: 20px 12px 14px
      }

      .jjj-legend {
        gap: 12px;
        flex-wrap: wrap
      }

      .jjj-bar-label {
        display: none
      }

      .jjj-dialog {
        width: min(720px, 96vw)
      }
    }

    @media(max-width:620px) {
      .jjj-head {
        display: grid
      }

      .jjj-method {
        width: 100%
      }

      .jjj-head h1 {
        font-size: 27px
      }

      .jjj-section-head {
        display: grid
      }

      .jjj-hint {
        margin: 0
      }

      .jjj-chart-wrap {
        overflow-x: auto;
        padding-top: 50px
      }

      .jjj-trend-svg {
        min-width: 730px
      }

      .jjj-modal {
        padding: 0
      }

      .jjj-dialog {
        width: 100vw;
        height: 100dvh;
        max-height: none;
        border: 0;
        border-radius: 0;
        padding: 16px
      }

      .jjj-modal-head {
        top: -16px;
        margin: -16px -16px 14px;
        padding: 14px 16px
      }

      .jjj-detail,
      .jjj-metrics {
        padding: 20px 16px
      }

      .jjj-summary {
        grid-template-columns: 1fr 1fr
      }

      .jjj-summary div:last-child {
        grid-column: 1/-1;
        border-top: 1px solid #173b62
      }
    }
  </style>
</head>

<body style="margin:0;background:#031126">
  <section class="jjj-dashboard" id="jjj-education-dashboard">
    <header class="jjj-head">
      <div>
        <p class="jjj-eyebrow">2015—2024 · 十年统一标尺</p>
        <h1>京津冀教育协同指数(年度)</h1>
        <p class="jjj-subtitle">年度趋势与指标结构交互分析</p>
      </div>
      <div class="jjj-method"><span>数据口径</span><strong>一级指标等权 25%</strong><small>缺失值暂不填补，层内有效权重重新归一化</small></div>
    </header>
    <article class="jjj-panel jjj-trend-panel">
      <div class="jjj-section-head">
        <div>
          <p class="jjj-kicker">年度趋势</p>
          <h2>京津冀教育协同度指数</h2>
        </div>
        <p class="jjj-hint">悬浮查看数值 · 点击彩色节点查看指标结构</p>
      </div>
      <div class="jjj-legend"><span><i class="jjj-bar-key"></i>京津冀总体</span><span><i
            style="background:#ff9d2e"></i>北京</span><span><i style="background:#22c7c9"></i>天津</span><span><i
            style="background:#a56de2"></i>河北</span></div>
      <div class="jjj-chart-wrap"><svg class="jjj-trend-svg" viewBox="0 0 960 430" aria-label="京津冀教育发展指数趋势图"></svg>
      </div>
      <p class="jjj-note">注：蓝色柱形为三地发展指数的算术平均，仅用于展示区域平均水平，不等同于原表中的官方“总指数”。</p>
    </article>
    <p class="jjj-source"><strong>数据来源：</strong>《京津冀教育发展指数_新版方法.xlsx》中的“年度发展指数”与“一级指标得分”工作表。显示值四舍五入至两位小数。</p>
    <div class="jjj-tooltip" aria-hidden="true"></div>
    <div class="jjj-modal" aria-hidden="true">
      <section class="jjj-dialog" role="dialog" aria-modal="true" aria-labelledby="jjj-dialog-title">
        <header class="jjj-modal-head">
          <div>
            <p>指标结构详情</p>
            <h2 id="jjj-dialog-title"></h2>
          </div><button class="jjj-close" type="button" aria-label="关闭指标详情弹窗">×</button>
        </header>
        <div class="jjj-detail-grid">
          <article class="jjj-panel jjj-detail"></article>
          <article class="jjj-panel jjj-metrics"></article>
        </div>
        <p class="jjj-modal-note">点击弹窗外区域、右上角关闭按钮或按 Esc 键均可返回趋势图。</p>
      </section>
    </div>
  </section>

  <script>
    (() => {
      /* ================================================================
         数据区：当前数据由 Excel 核对后写入这里，并非浏览器实时连接 Excel。
         新增年份时，同时向 years、annual 三个数组和 levelScores 三个二维数组
         各追加一项；每个 levelScores 年度数组依次对应下面四个 indicators。
         ================================================================ */
      const DATA = {
        years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024],
        regions: ["北京", "天津", "河北"],
        indicators: ["教育普及与规模", "教育资源投入", "高校创新与服务能力", "在地国际化水平"],
        colors: {北京: "#ff9d2e", 天津: "#22c7c9", 河北: "#a56de2"},
        annual: {
          北京: [45.415840, 42.804894, 47.597708, 53.891496, 64.220662, 75.607824, 82.432644, 83.136668, 80.653078, 75.714126],
          天津: [42.125502, 44.673173, 45.031226, 46.819695, 45.342263, 49.272727, 51.417849, 53.691838, 48.508308, 37.843542],
          河北: [23.838674, 22.705261, 21.742511, 26.819204, 30.101809, 20.945727, 22.361960, 23.505441, 19.915840, 25.387271]
        },
        levelScores: {
          北京: [[65.638767, 14.842044, 53.356464, 47.826087], [44.052863, 15.310587, 55.334387, 56.521739], [53.964758, 16.965639, 56.851740, 62.608696], [68.281938, 16.395882, 63.062076, 67.826087], [91.850220, 19.307147, 71.812238, 73.913043], [84.581498, 58.602054, 79.247745, 80], [100, 58.906223, 85.606963, 85.217391], [90.308370, 60.822402, 92.720248, 88.695652], [75.330396, 59.955395, 93.413477, 93.913043], [44.052863, 59.187306, 99.616335, 100]],
          天津: [[77.533040, 54.439578, 29.572869, 6.956522], [80.176211, 55.407762, 30.065239, 13.043478], [81.497797, 60.474700, 22.500232, 15.652174], [83.259912, 62.314459, 24.313104, 17.391304], [82.378855, 56.636662, 22.353533, 20], [85.903084, 63.159109, 26.289585, 21.739130], [87.224670, 64.517331, 31.320701, 22.608696], [87.444934, 74.743960, 28.230633, 24.347826], [66.299559, 73.451614, 28.195104, 26.086957], [61.674009, 32.039687, 28.964819, 28.695652]],
          河北: [[18.722467, 76.632231, 0, 0], [6.607930, 79.291860, .573429, 4.347826], [11.453744, 65.929286, 2.630493, 6.956522], [16.519824, 76.350514, 5.710827, 8.695652], [18.942731, 83.609249, 6.550908, 11.304348], [14.757709, 42.479547, 12.632607, 13.913043], [17.180617, 38.965291, 17.649760, 15.652174], [14.096916, 43.243190, 19.290354, 17.391304], [0, 40.829864, 19.703062, 19.130435], [10.352423, 48.031909, 21.425624, 21.739130]]
        }
      };

      DATA.regions.forEach(region => {
        const base = DATA.annual[region][0];
        DATA.annual[region] = DATA.annual[region].map(value => value / base * 100);
      });
      const root = document.getElementById("jjj-education-dashboard"), svg = root.querySelector(".jjj-trend-svg"), tip = root.querySelector(".jjj-tooltip"), modal = root.querySelector(".jjj-modal"), dialog = root.querySelector(".jjj-dialog"), closeBtn = root.querySelector(".jjj-close");
      const f = n => Number(n).toFixed(2), change = n => (n > 0 ? "+" : "") + f(n), NS = "http://www.w3.org/2000/svg";
      const W = 960, H = 430, L = 58, R = 24, T = 38, B = 54, pw = W - L - R, ph = H - T - B, n = DATA.years.length, chartMax = Math.max(120, Math.ceil(Math.max(...Object.values(DATA.annual).flat()) / 20) * 20), tickStep = chartMax / 5, x = i => L + (i + .5) * pw / n, y = v => T + ph - v / chartMax * ph;
      const avg = DATA.years.map((_, i) => DATA.regions.reduce((s, r) => s + DATA.annual[r][i], 0) / 3);
      const S = (tag, attrs = {}, text = "") => {const el = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v)); if (text !== "") el.textContent = text; return el};
      const defs = S("defs"), grad = S("linearGradient", {id: "jjjBarGradient", x1: 0, y1: 0, x2: 0, y2: 1}); grad.append(S("stop", {offset: 0, "stop-color": "#147cff"}), S("stop", {offset: 1, "stop-color": "#06408f"})); defs.append(grad); svg.append(defs);
      Array.from({length: 6}, (_, i) => i * tickStep).forEach(v => {svg.append(S("line", {x1: L, x2: W - R, y1: y(v), y2: y(v), class: "jjj-grid"}), S("text", {x: L - 12, y: y(v) + 5, "text-anchor": "end", class: "jjj-axis"}, Math.round(v)))});
      avg.forEach((v, i) => {svg.append(S("rect", {x: x(i) - 16, y: y(v), width: 32, height: y(0) - y(v), rx: 3, fill: "url(#jjjBarGradient)", opacity: .84}), S("text", {x: x(i), y: y(v) - 8, "text-anchor": "middle", class: "jjj-bar-label"}, f(v)), S("text", {x: x(i), y: H - 22, "text-anchor": "middle", class: "jjj-year"}, DATA.years[i]))});
      DATA.regions.forEach(region => {const d = DATA.annual[region].map((v, i) => (i ? "L" : "M") + x(i) + "," + y(v)).join(" "); svg.append(S("path", {d, fill: "none", stroke: DATA.colors[region], "stroke-width": 3, "stroke-linejoin": "round"})); DATA.annual[region].forEach((v, i) => {const c = S("circle", {cx: x(i), cy: y(v), r: 5, fill: DATA.colors[region], stroke: "#071b35", "stroke-width": 2, class: "jjj-point", tabindex: 0, role: "button", "data-region": region, "data-index": i, "aria-label": `${DATA.years[i]}年${region}发展指数${f(v)}，点击查看指标详情`}); svg.append(c)})});
      const focus = S("line", {x1: x(n - 1), x2: x(n - 1), y1: T, y2: y(0), class: "jjj-focus"}); svg.append(focus);

      const rank = (region, i) => DATA.regions.slice().sort((a, b) => DATA.annual[b][i] - DATA.annual[a][i]).indexOf(region) + 1;
      function showTip(e) {const c = e.currentTarget, region = c.dataset.region, i = +c.dataset.index, v = DATA.annual[region][i]; tip.innerHTML = `<strong>${DATA.years[i]} · ${region}</strong><span>发展指数　${f(v)}</span><span>年度排名　第 ${rank(region, i)} 名</span><em>点击查看四项指标</em>`; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.classList.add("show"); focus.setAttribute("x1", x(i)); focus.setAttribute("x2", x(i))}
      function hideTip() {tip.classList.remove("show")}
      svg.querySelectorAll(".jjj-point").forEach(c => {c.addEventListener("pointerenter", showTip); c.addEventListener("pointermove", showTip); c.addEventListener("pointerleave", hideTip); c.addEventListener("focus", showTip); c.addEventListener("blur", hideTip); c.addEventListener("click", () => openModal(c.dataset.region, +c.dataset.index)); c.addEventListener("keydown", e => {if (e.key === "Enter" || e.key === " ") {e.preventDefault(); openModal(c.dataset.region, +c.dataset.index)} })});

      function radar(region, i) {const scores = DATA.levelScores[region][i], cx = 230, cy = 190, r = 120, pt = (axis, value) => {const a = -Math.PI / 2 + axis * Math.PI / 2, rr = r * value / 100; return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]}, poly = value => DATA.indicators.map((_, j) => pt(j, value).join(",")).join(" "), labels = DATA.indicators.map((_, j) => pt(j, 125)); let h = `<svg viewBox="0 0 460 385" class="jjj-radar" aria-label="${region}${DATA.years[i]}年四项一级指标雷达图">`;[20, 40, 60, 80, 100].forEach(v => h += `<polygon points="${poly(v)}" class="jjj-radar-grid"/>`); DATA.indicators.forEach((_, j) => {const p = pt(j, 100); h += `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" class="jjj-radar-axis"/>`}); h += `<polygon points="${scores.map((v, j) => pt(j, v).join(",")).join(" ")}" fill="${DATA.colors[region]}" fill-opacity=".23" stroke="${DATA.colors[region]}" stroke-width="3"/>`; scores.forEach((v, j) => {const p = pt(j, v); h += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${DATA.colors[region]}" stroke="#fff" stroke-width="2"/>`}); labels.forEach((p, j) => {const anchor = j === 1 ? "start" : j === 3 ? "end" : "middle", dy = j === 0 ? -8 : j === 2 ? 17 : 0; h += `<text x="${p[0]}" y="${p[1] + dy}" text-anchor="${anchor}" class="jjj-radar-label">${DATA.indicators[j]}</text><text x="${p[0]}" y="${p[1] + dy + 18}" text-anchor="${anchor}" class="jjj-radar-value">${f(scores[j])}</text>`}); return h + "</svg>"}
      function openModal(region, i) {hideTip(); const scores = DATA.levelScores[region][i], prev = i ? DATA.levelScores[region][i - 1] : null, overall = i ? DATA.annual[region][i] - DATA.annual[region][i - 1] : null, best = DATA.indicators[scores.indexOf(Math.max(...scores))]; root.querySelector("#jjj-dialog-title").textContent = `${region} · ${DATA.years[i]} 年`; root.querySelector(".jjj-detail").innerHTML = `<div class="jjj-selection"><div><p class="jjj-kicker">点击点位详情</p><h3>${region} · ${DATA.years[i]}</h3></div><div class="jjj-score" style="border-color:${DATA.colors[region]}"><strong>${f(DATA.annual[region][i])}</strong><span>发展指数</span></div></div><div class="jjj-summary"><div><span>年度排名</span><strong>第 ${rank(region, i)} 名</strong></div><div><span>较上年</span><strong class="${overall !== null && overall < 0 ? "jjj-negative" : "jjj-positive"}">${overall === null ? "—" : change(overall)}</strong></div><div><span>最高维度</span><strong>${best}</strong></div></div>${radar(region, i)}`; let metrics = `<div class="jjj-metric-title"><div><p class="jjj-kicker">真实明细</p><h3>四项一级指标</h3></div><span class="jjj-scale">0—100 分</span></div><div class="jjj-metric-list">`; DATA.indicators.forEach((name, j) => {const diff = prev ? scores[j] - prev[j] : null; metrics += `<div class="jjj-metric-row"><div class="jjj-metric-top"><strong>${name}</strong><b>${f(scores[j])}</b></div><div class="jjj-track"><i style="width:${scores[j]}%;background:${DATA.colors[region]}"></i></div><div class="jjj-metric-foot"><span>${prev ? "上年 " + f(prev[j]) : "首年，无上年值"}</span><span class="${diff !== null && diff < 0 ? "jjj-negative" : "jjj-positive"}">${diff === null ? "—" : "同比 " + change(diff)}</span></div></div>`}); metrics += `</div><div class="jjj-compare"><h4>${DATA.years[i]} 年三地横向比较</h4>`; DATA.regions.forEach(r => metrics += `<div class="jjj-compare-row"><span><i style="background:${DATA.colors[r]}"></i>${r}</span><i><b style="width:${DATA.annual[r][i]}%;background:${DATA.colors[r]}"></b></i><strong>${f(DATA.annual[r][i])}</strong></div>`); root.querySelector(".jjj-metrics").innerHTML = metrics + "</div>"; modal.classList.add("open"); modal.setAttribute("aria-hidden", "false"); document.body.dataset.jjjPreviousOverflow = document.body.style.overflow; document.body.style.overflow = "hidden"; closeBtn.focus()}
      function closeModal() {modal.classList.remove("open"); modal.setAttribute("aria-hidden", "true"); document.body.style.overflow = document.body.dataset.jjjPreviousOverflow || ""}
      closeBtn.addEventListener("click", closeModal); modal.addEventListener("mousedown", e => {if (e.target === modal) closeModal()}); dialog.addEventListener("mousedown", e => e.stopPropagation()); document.addEventListener("keydown", e => {if (e.key === "Escape" && modal.classList.contains("open")) closeModal()});
      window.JJJ_EDUCATION_INDEX = {data: DATA, open: (region, year) => openModal(region, DATA.years.indexOf(year))};
    })();
  </script>
