<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>协同度指数</title><script src="assets/echarts.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#031426;color:#f2f7ff;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}.panel{width:min(620px,100%);height:450px;overflow:hidden;border:1px solid rgba(0,137,255,.65);border-radius:8px;background:rgba(3,27,50,.94);box-shadow:inset 0 0 18px rgba(0,102,204,.08)}h1{height:52px;margin:0;display:grid;place-items:center;border-bottom:1px solid rgba(80,130,170,.18);font-size:21px;letter-spacing:.05em}.content{height:calc(100% - 52px);display:flex;flex-direction:column;padding:15px 10px 14px}.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-bottom:8px}.tab{height:34px;min-width:0;padding:0 5px;overflow:hidden;border:1px solid rgba(0,137,255,.38);border-radius:4px;background:rgba(3,27,50,.45);color:#d9e6f2;font:600 13px "Microsoft YaHei",Arial,sans-serif;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.tab:hover,.tab:focus-visible{border-color:#00a8ff;outline:none}.tab.active{border-color:#0867e8;background:linear-gradient(135deg,#0867e8,#0755c6);color:#fff;box-shadow:0 0 12px rgba(0,125,255,.35)}.progress{height:3px;margin:0 4px 7px;overflow:hidden;border-radius:3px;background:rgba(80,130,170,.22)}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#0867e8,#00a8ff);transition:width .18s cubic-bezier(.215,.61,.355,1)}#chart{flex:1;min-height:0}
</style></head><body><section class="panel"><h1>协同度指数</h1><div class="content"><div id="tabs" class="tabs" role="tablist"></div><div class="progress"><i id="progress"></i></div><div id="chart"></div></div></section><script>
const months=['2015','2016','2017','2018','2019','2020','2021','2022','2023','2024'];const categories=[{name:'总体',color:'#00a8ff',values:[58.52,56.44,59.08,59.26,59.23,60.40,59.89,61.10,60.86,62.06]},{name:'教育资源投入',color:'#1368e8',values:[61.12,58.27,61.11,60.52,60.23,61.01,59.73,61.60,61.56,62.57]},{name:'教育普及与规模',color:'#16b8e8',values:[61.86,57.22,60.36,61.97,62.62,63.14,64.36,64.56,61.88,66.67]},{name:'在地国际化水平',color:'#68a84f',values:[47.68,49.99,52.84,52.96,54.90,56.31,56.08,57.57,58.18,59.18]},{name:'高校创新与服务能力',color:'#ed8615',values:[49.63,50.52,51.59,54.94,54.56,58.05,60.31,58.46,58.25,58.17]}];let categoryIndex=0,monthIndex=0,timer,pauseTimer;const chart=echarts.init(document.getElementById('chart')),tabs=document.getElementById('tabs'),progress=document.getElementById('progress');tabs.innerHTML=categories.map((c,i)=>`<button class="tab ${i===0?'active':''}" data-index="${i}" role="tab">${c.name}</button>`).join('');function render(){const c=categories[categoryIndex],v=c.values,shown=v.map((n,i)=>i<=monthIndex?n:null),low=Math.floor(Math.min(...v)/5)*5-2,high=Math.ceil(Math.max(...v)/5)*5+2;tabs.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('active',i===categoryIndex));chart.setOption({animation:true,animationDuration:200,animationEasing:'cubicOut',animationDurationUpdate:200,animationEasingUpdate:'cubicOut',grid:{left:42,right:16,top:5,bottom:20},xAxis:{type:'category',boundaryGap:false,data:months,axisLine:{lineStyle:{color:'rgba(160,190,220,.28)'}},axisTick:{show:false},axisLabel:{color:'#b8c7d9',fontSize:11,interval:0}},yAxis:{type:'value',min:low,max:high,splitNumber:4,axisLabel:{color:'#b8c7d9',fontSize:11},axisLine:{show:false},axisTick:{show:false},splitLine:{lineStyle:{color:'rgba(80,130,170,.18)'}}},tooltip:{trigger:'axis',backgroundColor:'rgba(3,18,36,.96)',borderColor:'rgba(0,145,255,.7)',textStyle:{color:'#f2f7ff'},formatter:p=>p[0]?.data==null?'':`${p[0].axisValue} 年<br/>${c.name}：${p[0].data.toFixed(2)}%`},series:[{type:'line',data:shown,smooth:.2,connectNulls:false,symbol:'circle',symbolSize:(_,p)=>p.dataIndex===monthIndex?11:4,lineStyle:{width:3,color:c.color},itemStyle:{color:c.color,borderColor:'#fff',borderWidth:p=>p.dataIndex===monthIndex?2:0},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:c.color+'55'},{offset:1,color:c.color+'02'}])},markLine:{silent:true,symbol:'none',label:{show:false},lineStyle:{color:'rgba(242,247,255,.7)',type:'dashed'},data:[{xAxis:months[monthIndex]}]}}]},{notMerge:true});progress.style.width=`${monthIndex/(months.length-1)*100}%`}function start(){clearInterval(timer);clearTimeout(pauseTimer);timer=setInterval(next,280)}function next(){if(monthIndex<months.length-1){monthIndex++;render()}else{clearInterval(timer);pauseTimer=setTimeout(()=>{categoryIndex=(categoryIndex+1)%categories.length;monthIndex=0;render();start()},700)}}tabs.addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;categoryIndex=+t.dataset.index;monthIndex=0;render();start()});new ResizeObserver(()=>chart.resize()).observe(document.getElementById('chart'));render();start();
</script></body></html>
